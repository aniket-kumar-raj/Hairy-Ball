<!DOCTYPE html>
<html>
<head>
    <title>The downloader for the all mighty proof</title>
    <style>
        body { 
            background: linear-gradient(to right, cyan 10%, purple 80%); 
            font-family: Arial, sans-serif; 
            padding: 20px;
        }
        .box-container {
            text-align: center;
            width: 100%;
        }
        h1 { 
            text-align: center; 
            border: 2px solid #333333; 
            padding: 15px;       
            display: inline-block; 
            border-radius: 4px;     
            
            /* Gold background for the box itself */
            background-color: #FFD700; 
            
            /* Animated linear gradient overlay for the text shine */
            background-image: linear-gradient(
                to right, 
                #554400 30%, 
                #ffffff 50%, 
                #554400 70%
            );
            background-size: 200% auto;
            
            /* Clips the gradient to the text shape */
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Triggers the infinite shine animation */
            animation: textShine 4s linear infinite;
        }
        
        /* The animation rules to move the shine */
        @keyframes textShine {
            to {
                background-position: 200% center;
            }
        }

        p { 
            color: black; 
            text-align: center; 
        }

        /* Added simple cursor update for button clarity */
        button {
            cursor: pointer;
            padding: 8px 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h4><p>check out my simple python script that proof of the almighty!!!</p></h4>
    <div class="box-container"> 
        <h1>The Hairy Ball Theorem</h1>
        <br>
        <!-- The button now triggers the JavaScript download workflow directly -->
        <button type="button" onclick="downloadProofFile()">Download</button>
    </div>

    <script>
        async function downloadProofFile() {
            const fileUrl = 'https://raw.githubusercontent.com/aniket-kumar-raj/Hairy-Ball/refs/heads/main/theorem%20proof.py';
            const fileName = 'theorem_proof.py';

            try {
                // Fetch the remote file data
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Failed to fetch the file.');

                // Convert response data into a browser local blob URL
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                // Create a temporary hidden anchor to trigger download natively
                const tempLink = document.createElement('a');
                tempLink.style.display = 'none';
                tempLink.href = blobUrl;
                tempLink.download = fileName;

                document.body.appendChild(tempLink);
                tempLink.click();

                // Clean up memory and DOM elements
                window.URL.revokeObjectURL(blobUrl);
                tempLink.remove();
                
            } catch (error) {
                console.error('Download error:', error);
                alert('Could not download the file directly. Please try again or right-click to save.');
            }
        }
    </script>
</body>
</html>
